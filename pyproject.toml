[project]
name = "chuck-gpu"
version = "0.1.0"
description = "Run any command on a Modal cloud GPU as if it were local"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["modal>=1.6", "pystray>=0.19", "pillow>=10"]

[project.scripts]
chuck-gpu = "chuck-gpu.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chuck-gpu"]

[tool.setuptools.package-data]
chuck-gpu = ["static/*"]
